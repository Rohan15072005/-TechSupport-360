spring.application.name=techsupport-360

# MySQL connection. Override credentials with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techsupport360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: replace this development-only value in production (minimum 32 characters).
jwt.secret=${JWT_SECRET:TechSupport360-Development-Key-Change-Before-Production-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# HTTP server
server.port=${PORT:8080}
server.error.include-message=always

# Optional bootstrap administrator. Leave blank to disable automatic admin creation.
app.bootstrap-admin.name=${ADMIN_NAME:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
