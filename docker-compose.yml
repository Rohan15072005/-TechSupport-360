services:
  mysql:
    image: mysql:8.4
    container_name: techsupport360-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: techsupport360
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    ports:
      - "3306:3306"
    volumes:
      - techsupport360_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  techsupport360_mysql_data:
